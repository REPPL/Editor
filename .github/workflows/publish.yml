# The production repository's pipeline.
#
# Editor writes the site and pushes it; this workflow reports on what arrived.
# It does not gate the deploy: gating means deploying from the workflow with a
# token, and Editor holds no credential of its own. No secret, no token and no
# `secrets.*` reference appears in this file.
#
# Actions are pinned by full commit SHA, with the version in a comment beside
# it, so a moved tag cannot change what runs here.
name: publish

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/verify-site.mjs"
      - ".github/workflows/publish.yml"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: verify the site
        run: node tools/verify-site.mjs site

  # ---------------------------------------------------------------------
