  # Owner: the referenced-assets spec. Verifies every object named in the
  # asset manifest against its recorded hash in object storage before the
  # deploy is reported good. Left as a stub because phase 1 publishes copied
  # assets only and holds no storage credential.
  # ---------------------------------------------------------------------
  assets:
    name: verify assets above the ceiling (stub)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: not yet implemented
        run: echo "stub: map #15 verifies the asset manifest here"

  # ---------------------------------------------------------------------
  # STUB — the journal PDF (map #21, itd-2609051336019782).
  # Owner: the PDF spec. Runs the core to produce Typst source for each
  # variant, runs Typst, and stores each PDF beside its version.
