      - name: not yet implemented
        run: echo "stub: map #21 renders the PDF here"

  # ---------------------------------------------------------------------
  # STUB — the access policy (map #20, itd-2609051336005698).
  # Owner: the gated-document spec. Applies the Cloudflare Access policy from
  # the committed access file, over the document's id, with the pipeline's own
